<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d">
  <title id="t">Путь запроса</title>
  <desc id="d">Голосовое сообщение из Telegram попадает в бота, задача уходит в очередь Redis, воркер распознаёт её моделью GigaAM v3, текст возвращается в чат, а запись остаётся в SQLite.</desc>
  <style>
    .bg { fill: #fbf1c7; }
    .card { fill: #ebdbb2; stroke: #d5c4a1; stroke-width: 1.5; }
    .ink { fill: #3c3836; }
    .soft { fill: #6a5e55; }
    .line { stroke: #928374; stroke-width: 1.5; fill: none; }
    .mark { fill: #928374; }
    .label { font: 700 21px "JetBrains Mono", ui-monospace, monospace; }
    .note { font: 400 15px "JetBrains Mono", ui-monospace, monospace; }
    .meta { font: 400 13px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #282828; }
      .card { fill: #3c3836; stroke: #504945; }
      .ink { fill: #ebdbb2; }
      .soft { fill: #b1a491; }
      .mark { fill: #928374; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="640" rx="12"/>
  <text class="meta soft" x="60" y="52">lazy to text: от голосового до текста</text>

  <rect class="card" x="60" y="80" width="420" height="86" rx="8"/>
  <text class="meta soft" x="84" y="112">telegram</text>
  <text class="label ink" x="84" y="145">голосовое сообщение</text>

  <rect class="card" x="60" y="200" width="420" height="86" rx="8"/>
  <text class="meta soft" x="84" y="232">бот</text>
  <text class="label ink" x="84" y="265">скачал файл</text>

  <rect class="card" x="640" y="200" width="260" height="86" rx="8"/>
  <text class="meta soft" x="664" y="232">sqlite</text>
  <text class="label ink" x="664" y="265">история</text>

  <rect class="card" x="60" y="320" width="420" height="86" rx="8"/>
  <text class="meta soft" x="84" y="352">redis</text>
  <text class="label ink" x="84" y="385">очередь задач</text>

  <rect class="card" x="60" y="440" width="420" height="86" rx="8"/>
  <text class="meta soft" x="84" y="472">воркер, cpu</text>
  <text class="label ink" x="84" y="505">GigaAM v3 e2e CTC</text>

  <rect class="card" x="640" y="440" width="260" height="86" rx="8"/>
  <text class="meta soft" x="664" y="472">чат</text>
  <text class="label ink" x="664" y="505">текст</text>

  <path class="line" d="M270 166 V192" marker-end="url(#a)"/>
  <path class="line" d="M270 286 V312" marker-end="url(#a)"/>
  <path class="line" d="M270 406 V432" marker-end="url(#a)"/>
  <path class="line" d="M480 243 H632" marker-end="url(#a)"/>
  <path class="line" d="M480 483 H632" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mark" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="note soft" x="60" y="586">файл удаляется после распознавания, в базе остаётся текст</text>
</svg>
