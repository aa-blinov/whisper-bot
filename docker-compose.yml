services:
  redis:
    image: redis:7-alpine
    container_name: lazy-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lazy-to-text-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-to-text-bot:latest
    container_name: lazy-to-text-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
    healthcheck:
      # Бот пишет файл в post_init: healthy значит «приложение собрано и
      # профиль обновлён», а не «контейнер запущен».
      test: ["CMD", "test", "-f", "/tmp/bot-ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  huey-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-to-text-bot:latest
    container_name: huey-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.consumer"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HUEY_WORKER_COUNT=1
      - HUEY_WORKER_TYPE=process
    volumes:
      - ./data:/app/data
    healthcheck:
      # Воркер пишет файл после прогрева, поэтому healthy значит «модель
      # действительно посчитала», а не «процесс запустился».
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s
    depends_on:
      redis:
        condition: service_healthy
