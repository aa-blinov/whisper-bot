services:
  redis:
    image: redis:7-alpine
    container_name: whisper-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  telegram-stt-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-stt-bot:latest
    container_name: telegram-stt-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  huey-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-stt-bot:latest
    container_name: huey-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.consumer"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HUEY_WORKER_COUNT=1
      - HUEY_WORKER_TYPE=process
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
