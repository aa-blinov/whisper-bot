services:
  postgres:
    image: postgres:17-alpine
    container_name: lazy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lazy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazy}
      POSTGRES_DB: ${POSTGRES_DB:-lazy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lazy} -d ${POSTGRES_DB:-lazy}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lazy-redis
    restart: unless-stopped
    # volatile-lru вытесняет только ключи с TTL (результаты задач), а
    # очередь без TTL остаётся на месте. AOF переживает перезапуск Redis.
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lazy-to-text-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-to-text-bot:latest
    container_name: lazy-to-text-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
    volumes:
      - ./data:/app/data
    healthcheck:
      # Бот пишет файл в post_init: healthy значит «приложение собрано и
      # профиль обновлён», а не «контейнер запущен».
      test: ["CMD", "test", "-f", "/tmp/bot-ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  huey-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazy-to-text-bot:latest
    container_name: huey-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.consumer"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Два потока на один процесс: модели общие, память не удваивается.
      # Значения приходят из .env, здесь только запасные.
      - HUEY_WORKER_COUNT=${HUEY_WORKER_COUNT:-2}
      - HUEY_WORKER_TYPE=${HUEY_WORKER_TYPE:-thread}
    volumes:
      - ./data:/app/data
      # Файлы локального Bot API: воркер читает их по пути, который
      # возвращает get_file, без скачивания по сети.
      - bot-api-data:/var/lib/telegram-bot-api:ro
    healthcheck:
      # Воркер пишет файл после прогрева, поэтому healthy значит «модель
      # действительно посчитала», а не «процесс запустился».
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 180s
    depends_on:
      redis:
        condition: service_healthy

  # Локальный сервер Bot API. Нужен, чтобы принимать файлы больше 20 МБ:
  # облачный Bot API отдаёт ботам только 20 МБ. Запускается отдельно:
  #   docker compose --profile local-api up -d
  # и требует TELEGRAM_API_ID и TELEGRAM_API_HASH, плюс в .env:
  #   TELEGRAM_API_BASE=http://telegram-bot-api:8081/bot
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: lazy-telegram-api
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

volumes:
  pgdata:
  bot-api-data:
